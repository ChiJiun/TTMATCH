name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 單元測試不需要競賽資料、樹模型套件或 torch
      - run: pip install pandas numpy scikit-learn pytest
      - run: python -m pytest -q tests
